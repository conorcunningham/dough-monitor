# Installed by pi/setup.sh as /etc/mosquitto/conf.d/lan.conf.
#
# Mosquitto 2 listens on localhost only until it is given a listener. This opens
# it to the LAN without a password, which is fine at home. Add a password_file
# (and set MQTT_USERNAME/MQTT_PASSWORD in the app's .env) before exposing it any
# further.
listener 1883
allow_anonymous true

# The app's listener uses a persistent session, so the broker queues readings
# for it while it is offline. The default cap of 1000 messages is about ninety
# minutes once the neighbours' sensors are counted; this covers a night.
max_queued_messages 20000
