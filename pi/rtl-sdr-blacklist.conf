# Installed by pi/setup.sh as /etc/modprobe.d/rtl-sdr-blacklist.conf.
#
# The kernel sees an RTL-SDR dongle as a DVB-T TV receiver and grabs it at boot.
# rtl_433 can detach that driver itself, but keeping it off the dongle altogether
# is cleaner. Takes effect at the next boot.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2832_sdr
