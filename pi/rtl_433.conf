# rtl_433 config for the dough monitor: decode the 433 MHz room sensor and
# publish every event to the MQTT broker on this Pi.
#   rtl_433 -c pi/rtl_433.conf
# pi/rtl_433.service runs it from /etc/rtl_433/rtl_433.conf under systemd:
#   sudo install -D -m 644 pi/rtl_433.conf /etc/rtl_433/rtl_433.conf

frequency 433.92M

# Timestamps as ISO 8601 with the UTC offset (e.g. 2026-10-09T12:00:00+0200),
# so the app never has to guess the Pi's time zone.
report_meta time:iso:tz
# Add rssi/snr/noise to each event: handy for judging an antenna.
report_meta level

# Report Celsius even from sensors that transmit Fahrenheit.
convert si

# Default topics are rtl_433/<hostname>/events (what the app subscribes to)
# plus rtl_433/<hostname>/states and rtl_433/<hostname>/devices/...
# QoS 1 lets the broker queue events for the app while the laptop is asleep.
# If the broker needs a login: mqtt://localhost:1883,user=NAME,pass=SECRET,qos=1
output mqtt://localhost:1883,qos=1

# Optional: decode only your sensor's protocol to save CPU. Find the number
# with `rtl_433 -M protocol -F json` (the "protocol" field) or `rtl_433 -R help`.
# protocol 19
