{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dough Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/pico-2.1.1.min.css' %}">
  <link rel="stylesheet" href="{% static 'doughs/doughs.css' %}">
  <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="container">
    <nav>
      <ul><li><a href="{% url 'doughs:home' %}"><strong>Dough Monitor</strong></a></li></ul>
      <ul>
        <li><a href="{% url 'doughs:list' %}">Doughs</a></li>
        <li><a href="{% url 'doughs:readings_overview' %}">Readings</a></li>
        <li><a href="{% url 'admin:index' %}">Admin</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% for message in messages %}
      <p class="message {{ message.tags }}" role="alert">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
